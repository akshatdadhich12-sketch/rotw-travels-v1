<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <!-- ROTW Travels Icon Sprite (v1) -->
  <!-- Consistent 24x24 grid, 1.75px stroke, round caps & joins -->

  <!-- 1. map-pin (Destinations) -->
  <symbol id="icon-map-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 21c-4.2-5.4-7-8.8-7-12a7 7 0 1 1 14 0c0 3.2-2.8 6.6-7 12z"/>
    <circle cx="12" cy="9" r="2.5"/>
  </symbol>

  <!-- 2. route (Journeys) -->
  <symbol id="icon-route" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="6" cy="19" r="2.5"/>
    <circle cx="18" cy="5" r="2.5"/>
    <path d="M8.5 19h2.5a4 4 0 0 0 4-4v-6a4 4 0 0 1 4-4h-1"/>
  </symbol>

  <!-- 3. compass (Experiences / Exploration) -->
  <symbol id="icon-compass" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <polygon points="15.5 8.5 13.5 13.5 8.5 15.5 10.5 10.5"/>
    <line x1="10.5" y1="10.5" x2="13.5" y2="13.5"/>
  </symbol>

  <!-- 4. briefcase (For agents / B2B) -->
  <symbol id="icon-briefcase" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="7" width="18" height="13" rx="2"/>
    <path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
    <line x1="3" y1="12" x2="21" y2="12"/>
    <path d="M10 12v2a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1v-2"/>
  </symbol>

  <!-- 5. notebook (Sasha's notebook) -->
  <symbol id="icon-notebook" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="5" y="3" width="15" height="18" rx="2"/>
    <line x1="9" y1="3" x2="9" y2="21"/>
    <path d="M14 3v6l-2-1.5L10 9V3"/>
    <line x1="12" y1="13" x2="16" y2="13"/>
    <line x1="12" y1="17" x2="16" y2="17"/>
    <path d="M3 6h2M3 10h2M3 14h2M3 18h2"/>
  </symbol>

  <!-- 6. paper-plane (Plan a trip CTA) -->
  <symbol id="icon-paper-plane" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21.5 2.5L2 10.5l7.5 3L13 21l8.5-18.5z"/>
    <path d="M9.5 13.5L14.5 9"/>
  </symbol>

  <!-- 7. ticket (Boarding pass / Reservations) -->
  <symbol id="icon-ticket" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 9a3 3 0 0 1 0 6v3a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-3a3 3 0 0 1 0-6V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v3z"/>
    <line x1="16" y1="4" x2="16" y2="7"/>
    <line x1="16" y1="11" x2="16" y2="13"/>
    <line x1="16" y1="17" x2="16" y2="20"/>
    <line x1="6" y1="10" x2="12" y2="10"/>
    <line x1="6" y1="14" x2="10" y2="14"/>
  </symbol>

  <!-- 8. globe (Language switcher / Global) -->
  <symbol id="icon-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <line x1="3" y1="12" x2="21" y2="12"/>
    <path d="M12 3a13.5 13.5 0 0 1 4 9 13.5 13.5 0 0 1-4 9 13.5 13.5 0 0 1-4-9 13.5 13.5 0 0 1 4-9z"/>
  </symbol>

  <!-- 9. phone (Moscow Bureau / Contact) -->
  <symbol id="icon-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 16.5v3.5a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.07-8.67A2 2 0 0 1 3.1 2h3.5a2 2 0 0 1 2 1.72c.13.96.37 1.9.7 2.81a2 2 0 0 1-.45 2.11L7.38 10.1a16 16 0 0 0 6.54 6.54l1.47-1.47a2 2 0 0 1 2.11-.45c.91.33 1.85.57 2.81.7A2 2 0 0 1 21 16.5z"/>
  </symbol>

  <!-- 10. mail (Direct Inquiries) -->
  <symbol id="icon-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="5" width="18" height="14" rx="2"/>
    <polyline points="3 7 12 13 21 7"/>
  </symbol>

  <!-- 11. clock (Local time / Duration) -->
  <symbol id="icon-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <polyline points="12 7 12 12 15.5 14"/>
  </symbol>

  <!-- 12. menu (Mobile hamburger) -->
  <symbol id="icon-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <line x1="4" y1="7" x2="20" y2="7"/>
    <line x1="4" y1="12" x2="20" y2="12"/>
    <line x1="4" y1="17" x2="20" y2="17"/>
  </symbol>

  <!-- 13. close (Drawer / Modal dismiss) -->
  <symbol id="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <line x1="5" y1="5" x2="19" y2="19"/>
    <line x1="19" y1="5" x2="5" y2="19"/>
  </symbol>

  <!-- 14. chevron (Default down) -->
  <symbol id="icon-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="6 9 12 15 18 9"/>
  </symbol>
  <symbol id="icon-chevron-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="6 9 12 15 18 9"/>
  </symbol>
  <symbol id="icon-chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="9 6 15 12 9 18"/>
  </symbol>
  <symbol id="icon-chevron-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="15 6 9 12 15 18"/>
  </symbol>
  <symbol id="icon-chevron-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="6 15 12 9 18 15"/>
  </symbol>

  <!-- 15. arrow (Default right) -->
  <symbol id="icon-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <line x1="4" y1="12" x2="20" y2="12"/>
    <polyline points="14 6 20 12 14 18"/>
  </symbol>
  <symbol id="icon-arrow-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <line x1="4" y1="12" x2="20" y2="12"/>
    <polyline points="14 6 20 12 14 18"/>
  </symbol>
  <symbol id="icon-arrow-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <line x1="20" y1="12" x2="4" y2="12"/>
    <polyline points="10 6 4 12 10 18"/>
  </symbol>

  <!-- 16. search (Header search / Filter) -->
  <symbol id="icon-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11" cy="11" r="7"/>
    <line x1="16.5" y1="16.5" x2="21" y2="21"/>
  </symbol>

  <!-- 17. camera (Photo gallery / Highlights) -->
  <symbol id="icon-camera" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
