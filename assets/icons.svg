    <path d="M2 13c4-4 8-1 11-4s5-1 9 1"/>
    <path d="M2 17c4-4 7-2 11-5s5 0 9 3"/>
    <path d="M2 21c4-3 7-3 11-4s6 1 9 0"/>
    <line x1="6" y1="6" x2="6" y2="11"/>
    <line x1="12" y1="4" x2="12" y2="11"/>
    <line x1="18" y1="6" x2="18" y2="13"/>
    <circle cx="9" cy="4" r=".5" fill="currentColor"/>
    <circle cx="15" cy="3" r=".5" fill="currentColor"/>
  </symbol>

  <!-- 21. train (Trans-Siberian / Sapsan) -->
  <symbol id="icon-train" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="5" y="3" width="14" height="15" rx="3"/>
    <line x1="5" y1="10" x2="19" y2="10"/>
    <line x1="12" y1="3" x2="12" y2="10"/>
    <circle cx="8.5" cy="14.5" r="1" fill="currentColor"/>
    <circle cx="15.5" cy="14.5" r="1" fill="currentColor"/>
    <line x1="7" y1="21" x2="9.5" y2="18"/>
    <line x1="17" y1="21" x2="14.5" y2="18"/>
    <line x1="4" y1="21" x2="20" y2="21"/>
  </symbol>

  <!-- 22. plane (Flights / Arrival) -->
  <symbol id="icon-plane" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2c.8 0 1.3.9 1.3 2v5.3l7.7 4.4v2l-7.7-2.3v4.8l2.2 1.6V21L12 20l-3.5 1v-1.2l2.2-1.6v-4.8L3 15.7v-2l7.7-4.4V4c0-1.1.5-2 1.3-2z"/>
  </symbol>

  <!-- 23. sun (Summer / Seasonality / White Nights) -->
  <symbol id="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="4"/>
    <line x1="12" y1="2" x2="12" y2="4"/>
    <line x1="12" y1="20" x2="12" y2="22"/>
    <line x1="2" y1="12" x2="4" y2="12"/>
    <line x1="20" y1="12" x2="22" y2="12"/>
    <line x1="4.93" y1="4.93" x2="6.34" y2="6.34"/>
    <line x1="17.66" y1="17.66" x2="19.07" y2="19.07"/>
    <line x1="4.93" y1="19.07" x2="6.34" y2="17.66"/>
    <line x1="17.66" y1="6.34" x2="19.07" y2="4.93"/>
  </symbol>

  <!-- 24. anchor (Black Sea / Volga / Canals / Pacific) -->
  <symbol id="icon-anchor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="5" r="2"/>
    <line x1="12" y1="7" x2="12" y2="21"/>
    <line x1="6" y1="10" x2="18" y2="10"/>
    <path d="M4 14c0 4.4 3.6 8 8 8s8-3.6 8-8"/>
    <line x1="3" y1="13" x2="5" y2="13"/>
    <line x1="19" y1="13" x2="21" y2="13"/>
  </symbol>

  <!-- 25. users (Group tours / FIT / Guide meet) -->
  <symbol id="icon-users" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="9" cy="7" r="3.5"/>
    <path d="M2.5 19a6.5 6.5 0 0 1 13 0"/>
    <path d="M14.5 4.5a3 3 0 0 1 0 6"/>
    <path d="M17.5 14a5.5 5.5 0 0 1 4 5"/>
  </symbol>

  <!-- 26. calendar (Trip dates / Best season) -->
  <symbol id="icon-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4" width="18" height="17" rx="2"/>
    <line x1="8" y1="2" x2="8" y2="6"/>
    <line x1="16" y1="2" x2="16" y2="6"/>
    <line x1="3" y1="9" x2="21" y2="9"/>
    <circle cx="8" cy="13" r=".6" fill="currentColor"/>
    <circle cx="12" cy="13" r=".6" fill="currentColor"/>
    <circle cx="16" cy="13" r=".6" fill="currentColor"/>
    <circle cx="8" cy="17" r=".6" fill="currentColor"/>
    <circle cx="12" cy="17" r=".6" fill="currentColor"/>
    <circle cx="16" cy="17" r=".6" fill="currentColor"/>
  </symbol>

  <!-- 27. check (Included items / Door checklist) -->
  <symbol id="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="4 12.5 9 17.5 20 6.5"/>
  </symbol>

  <!-- Companion icons: star, shield-check, external-link, filter, copy -->
  <symbol id="icon-star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
  </symbol>

  <symbol id="icon-shield-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
    <polyline points="9 12 11 14 15 10"/>
  </symbol>

  <symbol id="icon-external-link" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
    <polyline points="15 3 21 3 21 9"/>
    <line x1="10" y1="14" x2="21" y2="3"/>
  </symbol>

  <symbol id="icon-filter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
  </symbol>

  <symbol id="icon-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="9" y="9" width="12" height="12" rx="2"/>
    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
  </symbol>
</svg>
