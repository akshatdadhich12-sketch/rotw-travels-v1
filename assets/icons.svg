    <circle cx="12" cy="14" r="3.5"/>
  </symbol>

  <!-- 18. mountain (Wilderness / Kamchatka / Caucasus) -->
  <symbol id="icon-mountain" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 20L10 6l5 8 3-4 4 10H2z"/>
    <path d="M7 11.5l3 2.5 3-2.5"/>
  </symbol>

  <!-- 19. snowflake (Winter Baikal / Ice) -->
  <symbol id="icon-snowflake" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <line x1="12" y1="2" x2="12" y2="22"/>
    <line x1="2" y1="12" x2="22" y2="12"/>
    <line x1="5" y1="5" x2="19" y2="19"/>
    <line x1="5" y1="19" x2="19" y2="5"/>
